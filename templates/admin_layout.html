<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title %}

    {% endblock %}
  </title>
  <link rel="stylesheet" href="../static/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      margin: 0;
      padding: 0;
    }

    .sidebar {
      background-color: #2c3e50;
      color: white;
      height: 100vh;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      overflow-x: hidden;
      padding-top: 60px;
      transition: 0.5s;
    }

    .closebtn {
      position: absolute;
      top: 0;
      right: 25px;
      font-size: 36px;
      margin-left: 50px;
    }

    .openbtn {
      font-size: 20px;
      cursor: pointer;
      background-color: #111;
      color: white;
      padding: 10px 15px;
      border: none;
    }

    #main {
      transition: margin-left 0.5s;
      padding: 20px;
      background-color: #ECF0F1;
    }

    .sidebar h2 {
      text-align: center;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      transition: 0.3s;
    }

    .sidebar ul li {
      padding: 15px;
      cursor: pointer;
    }

    .sidebar ul li:hover {
      background: #34495e;
    }

    header {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .table-container {
      margin-top: 20px;
      margin-bottom: 20px;
      padding: 20px;
      background: white;
      border-radius: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: black;
    }

    th,
    td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #ecf0f1;
    }

    @media screen and (max-height: 450px) {
      .sidebar {
        padding-top: 15px;
      }

      .sidebar a {
        font-size: 18px;
      }
    }

    {% block style %}
    {% endblock %}
    </style>
  </head>

  <body>
    <div id="sidebar" class="sidebar">
      <a href="javascript:void(0)" class="closebtn nav-link text-white" onclick="closeNav()">&times;</a>
      <h2>TIMELY</h2>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link text-white" href="/admin_dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/events">Events</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/users">Users</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/payments">Payments</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/feedbacks">Feedbacks</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/reports">Reports</a></li>
        <hr>
        <li class="nav-item"><a class="nav-link text-white" href="/admin_settings">Settings</a></li>
      </ul>
    </div>

    <div id="main">
      <button class="openbtn nav-link text-white" onclick="openNav()">&#9776;</button>
      {% block body %}

      {% endblock %}
    </div>
    <script src="../static/js/bootstrap.bundle.min.js"></script>
    <script>
      function openNav() {
        document.getElementById("sidebar").style.width = "33vw";
        document.getElementById("main").style.marginLeft = "33vw";
      }

      function closeNav() {
        document.getElementById("sidebar").style.width = "0";
        document.getElementById("main").style.marginLeft = "0";
      }
    </script>
  </body>

</html>
