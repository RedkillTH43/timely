{% extends "admin_layout.html" %}

{% block title %}
Users
{% endblock %}

{% block body %}
<header>
  <h2>Manage Users</h2>
</header>
<div class="table-container">
  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Role</th>
      <th>Operation</th>
    </tr>
    {% for user in users %}
    <tr>
      <td>{{ user.id }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.role }}</td>
      <td>
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">&equiv;</button>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="{{ url_for('edit_user', user_id=user.id) }}">Edit</a>
            </li>
            <li>
              <a class="dropdown-item" href="{{ url_for('delete_user', user_id=user.id) }}">Delete</a>
            </li>
          </ul>
        </div>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
<a href="/add_user"><button class="btn btn-primary" type="button">Add User</button></a>
{% endblock %}
